<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redirecting...</title></head>
<body style="margin:0;background:#FFF5EE;">
<div id="msg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#3D3228;text-align:center;padding:14vh 22px 40px;line-height:1.6;max-width:460px;margin:0 auto;"></div>
<script>
/* ─────────────────────────────────────────────────────────────
   Link redirector.

   The App Store problem, tested 2026-07-30, revised 2026-08-04:
   Instagram's in-app browser refuses to hand off to the App Store.
   Tested and ruled out, do not retry these:
     - https://apps.apple.com/...  stalls forever
     - itms-apps://apps.apple.com/...  also blocked
     - iframing the store  impossible, Apple sends X-Frame-Options: DENY
     - x-safari- via location.href  silently swallowed by IG
   UPDATE 2026-08-04: there IS a programmatic route after all, just not
   a browser one. instagram://extbrowser/?url=... is Instagram's own
   scheme and it opens Safari with no user steps. We try that first now
   and only fall back to asking them to tap the menu if it doesn't fire.
   Facebook/Messenger still need window.open('x-safari-' + url).

   Everything else (all non-store links, and every other browser)
   redirects normally.

   Also hardened 2026-07-30: localStorage is wrapped everywhere. It was
   unguarded and called synchronously while building the click-log body,
   so a throw inside an iOS webview killed the script before the
   redirect ever ran.
   ───────────────────────────────────────────────────────────── */
var SB_URL = 'https://ingvjqyqoqggskkrklhk.supabase.co';
var SB_KEY = 'sb_publishable_a_7d3ojYoI3Glt0R9AMbhA_1rH_urFn';
var params = new URLSearchParams(window.location.search);
var linkName = params.get('l');
var msg = document.getElementById('msg');
var settled = false;

function show(html) { msg.innerHTML = html; }

/* Where to leave the browser sitting after an App Store hand-off.
   On iOS the store opens as an APP, so this page stays on screen
   underneath it — whatever is here is what the person sees when they
   swipe the App Store away. It used to be this redirector's own "Tap to
   continue" fallback, which reads like a dead end. Send them back to the
   page they came from instead. */
var LANDING_FALLBACK = 'https://hellomelmo.com/app';
function returnUrl() {
  var r = document.referrer || '';
  if (/^https?:\/\//i.test(r) && r.indexOf('melmiztonian.github.io') === -1) return r;
  return LANDING_FALLBACK;
}

function isIOS() {
  var ua = navigator.userAgent || '';
  return /iPad|iPhone|iPod/i.test(ua) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

/* "Redirecting..." used to paint the instant the page loaded, so every
   single visitor saw it flash even when the hop took 300ms. The text now
   waits until the delay is long enough to be worth explaining. */
var spinnerTimer = setTimeout(function () {
  if (!settled) { show('Taking you there...'); }
}, 1200);
function stopSpinner() { clearTimeout(spinnerTimer); }

function getVisitorId() {
  try {
    var stored = localStorage.getItem('_vid');
    if (stored) return stored;
    var id = 'v_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    localStorage.setItem('_vid', id);
    return id;
  } catch (e) { return null; }
}

function isInAppBrowser() {
  return /Instagram|FBAV|FBAN|FB_IAB|TikTok|Snapchat|Line\//i.test(navigator.userAgent || '');
}
function isStoreUrl(u) {
  return /^https?:\/\/(apps|itunes)\.apple\.com\//i.test(u || '');
}

var BTN = 'display:inline-block;font-weight:700;font-size:17px;color:#050301;background:#F78C60;' +
          'border:3px solid #050301;border-radius:50px;padding:15px 34px;text-decoration:none;' +
          'box-shadow:-4px 4px 0 #050301;cursor:pointer;font-family:inherit;';

/* The in-app + App Store case. No navigation attempt, no stalling.
   Tell them what to do, and give them a copyable link as a second route. */
function showOpenInBrowser(dest) {
  settled = true;
  stopSpinner();
  show(
    '<div style="font-size:34px;margin-bottom:10px;">&#128241;</div>' +
    '<h1 style="font-size:21px;margin:0 0 12px;line-height:1.3;">One tiny step, sorry!</h1>' +
    '<p style="margin:0 0 20px;font-size:15.5px;">Instagram won\'t let the App Store open from inside its browser. ' +
    'Tap the <b>&#8943;</b> in the corner, then <b>Open in browser</b>, and it\'ll go straight through (:</p>' +
    '<p style="margin:0 0 16px;"><button id="cp" style="' + BTN + '">Copy the link instead</button></p>' +
    '<p style="margin:0 0 24px;font-size:13.5px;color:#8B7B6B;">Then paste it into Safari or Chrome.</p>' +
    '<p style="margin:0;font-size:13.5px;"><a href="' + dest + '" style="color:#8B7B6B;">or try opening it here anyway</a></p>'
  );
  var btn = document.getElementById('cp');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var url = window.location.href;
    function ok() { btn.textContent = 'Copied! Paste in Safari'; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(ok, function () { legacy(url, ok); });
    } else { legacy(url, ok); }
  });
  function legacy(text, cb) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly','');
    ta.style.position = 'absolute'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) {}
    document.body.removeChild(ta);
  }
}

/* Generic safety net for anything else that stalls. */
function fallback(dest) {
  if (settled) return;
  stopSpinner();
  settled = true;
  if (!dest) { show('Something went wrong, please try again.'); return; }
  show('<p style="margin:0 0 18px;">Tap to continue:</p>' +
       '<p style="margin:0;"><a href="' + dest + '" style="' + BTN + '">Continue</a></p>');
}

if (!linkName) {
  show('Invalid link.');
} else {
  var vid = getVisitorId();
  try {
    fetch(SB_URL + '/rest/v1/link_clicks', {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        link_name: linkName,
        referrer: document.referrer || null,
        user_agent: navigator.userAgent || null,
        utm_source: params.get('utm_source') || null,
        utm_medium: params.get('utm_medium') || null,
        utm_campaign: params.get('utm_campaign') || null,
        visitor_id: vid
      }),
      keepalive: true
    }).catch(function () {});
  } catch (e) { /* analytics must never block the redirect */ }

  var destination = null;
  setTimeout(function () { fallback(destination); }, 2500);

  try {
    fetch(SB_URL + '/rest/v1/links?name=eq.' + encodeURIComponent(linkName) + '&select=destination', {
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY }
    })
    .then(function (r) { return r.json(); })
    .then(function (rows) {
      if (!rows || !rows.length || !rows[0].destination) {
        settled = true; show('Link not found.'); return;
      }
      destination = rows[0].destination;

      /* In-app browser + App Store. The 2026-07-30 note below said the
         only route was asking the user to tap the webview menu. That was
         true of every method tried THEN, but not of instagram://extbrowser,
         which Instagram itself honours and which hands off to Safari
         without any user steps. Try that first, and keep the manual ask
         as the fallback if nothing happens. */
      if (isInAppBrowser() && isStoreUrl(destination)) {
        if (/Instagram|Threads|Barcelona/i.test(navigator.userAgent || '')) {
          stopSpinner();
          settled = true;
          var escaped = false;
          function markEscaped() { escaped = true; }
          document.addEventListener('visibilitychange', function () {
            if (document.hidden) markEscaped();
          });
          window.addEventListener('pagehide', markEscaped);
          window.addEventListener('blur', markEscaped);
          window.location.href = 'instagram://extbrowser/?url=' +
            encodeURIComponent(window.location.href);
          setTimeout(function () {
            if (!escaped) { settled = false; showOpenInBrowser(destination); }
          }, 1500);
          return;
        }
        stopSpinner();
        showOpenInBrowser(destination);
        return;
      }
      if (settled) { fallback(destination); return; }

      /* App Store on iOS opens as an app and leaves this page behind, so
         hand off and then quietly replace this page with wherever they
         came from. Every other case navigates normally and this page is
         gone, so the old fallback still applies there. */
      if (isStoreUrl(destination) && isIOS()) {
        stopSpinner();
        settled = true;
        window.location.href = destination;
        setTimeout(function () { window.location.replace(returnUrl()); }, 900);
        return;
      }

      stopSpinner();
      window.location.href = destination;
      setTimeout(function () { fallback(destination); }, 1500);
    })
    .catch(function () { fallback(null); });
  } catch (e) { fallback(null); }
}
</script>
</body></html>
